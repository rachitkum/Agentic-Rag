events {
    worker_connections 1024;
}

http {
    # Docker's embedded DNS resolves "api" to every running replica, so scaling with
    # --scale api=N needs no change here.
    upstream api_backend {
        # least_conn, not round-robin: /chat holds a connection for seconds waiting on
        # the LLM while /upload/status returns in milliseconds. Round-robin would hand
        # slow requests to a replica that already has several.
        least_conn;
        server api:3000;
    }

    # Coarse per-IP limit. The per-user limit that actually protects LLM spend has to
    # live in the app, where user_id is known -- this only blunts crude floods.
    limit_req_zone $binary_remote_addr zone=per_ip:10m rate=10r/s;

    # PDFs are the payload; the 1m default would reject most real uploads.
    client_max_body_size 50m;

    # Client address survives the hop, for logging and any app-side IP logic.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    server {
        listen 80;

        # Realtime voice: a WebSocket needs the upgrade handshake forwarded, and the
        # connection stays open for the length of the call -- nginx's 60s default read
        # timeout would cut it off mid-conversation.
        location /call {
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout  3600s;
            proxy_send_timeout  3600s;
        }

        # Ingestion is queued, so this returns quickly, but the upload body itself can
        # be large and slow to arrive.
        location /upload {
            limit_req zone=per_ip burst=5 nodelay;
            proxy_pass http://api_backend;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # A chat turn is several LLM calls; it routinely outlives the 60s default.
        location /chat {
            limit_req zone=per_ip burst=10 nodelay;
            proxy_pass http://api_backend;
            proxy_read_timeout 180s;
        }

        # Unrate-limited: this is nginx's own check, not client traffic.
        location = /health {
            proxy_pass http://api_backend;
            access_log off;
        }

        location = /ready {
            proxy_pass http://api_backend;
            access_log off;
        }

        location / {
            limit_req zone=per_ip burst=20 nodelay;
            proxy_pass http://api_backend;
        }
    }
}
