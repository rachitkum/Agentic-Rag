# Weaviate for the RAG agent. We supply our own vectors (local MiniLM embeddings),
# so no vectorizer module is enabled.
#
#   docker compose up -d
#
# Then point the app at it:  WEAVIATE_URL=http://localhost:8080
services:
  weaviate:
    image: cr.weaviate.io/semitechnologies/weaviate:1.27.0
    ports:
      - "8080:8080"     # REST
      - "50051:50051"   # gRPC (used by weaviate-client v4)
    restart: on-failure:0
    environment:
      QUERY_DEFAULTS_LIMIT: 25
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: "/var/lib/weaviate"
      DEFAULT_VECTORIZER_MODULE: "none"
      ENABLE_MODULES: ""
      CLUSTER_HOSTNAME: "node1"
    volumes:
      - weaviate_data:/var/lib/weaviate

  # Source of truth for users and their tenant assignment.
  # Tables are hash-partitioned on user_id; see src/db/postgres.py.
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    restart: on-failure:0
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Short-term chat memory, keyed by (user_id, session_id).
  valkey:
    image: valkey/valkey:8-alpine
    ports:
      - "6379:6379"
    restart: on-failure:0
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - valkey_data:/data

  # The API. No host port: nginx is the only way in, so replicas don't contend for
  # one. Scale with:  docker compose up -d --scale api=3
  api:
    build: .
    restart: on-failure
    env_file:
      - .env
    environment:
      WEAVIATE_URL: http://weaviate:8080
      VALKEY_URL: redis://valkey:6379/0
      POSTGRES_URL: postgresql://rag:rag@postgres:5432/rag
    healthcheck:
      # /ready, not /health: it reports 503 until the models are resident, so compose
      # does not call a replica healthy while it is still loading them.
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:3000/ready').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    depends_on:
      valkey:
        condition: service_healthy
      postgres:
        condition: service_healthy
      weaviate:
        condition: service_started

  # Single entry point; routes across whatever api replicas are running.
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "3000:80"
    restart: on-failure
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api

  # Ingestion workers. Scale with:  docker compose up -d --scale worker=4
  # No ports: it consumes from the queue rather than serving HTTP.
  worker:
    build: .
    command: ["/app/.venv/bin/celery", "-A", "src.worker", "worker", "--loglevel=info"]
    restart: on-failure
    env_file:
      - .env
    environment:
      # Service names, not localhost: these resolve on the compose network.
      WEAVIATE_URL: http://weaviate:8080
      VALKEY_URL: redis://valkey:6379/0
      POSTGRES_URL: postgresql://rag:rag@postgres:5432/rag
    depends_on:
      valkey:
        condition: service_healthy
      postgres:
        condition: service_healthy
      weaviate:
        condition: service_started

volumes:
  weaviate_data:
  postgres_data:
  valkey_data:
